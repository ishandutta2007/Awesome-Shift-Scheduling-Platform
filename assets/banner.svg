<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes scanline {
        0% { transform: translateX(0); }
        100% { transform: translateX(540px); }
      }
      @keyframes shiftLight1 {
        0%, 100% { fill: #0284c7; }
        50% { fill: #38bdf8; }
      }
      @keyframes shiftLight2 {
        0%, 100% { fill: #4f46e5; }
        50% { fill: #818cf8; }
      }
      @keyframes shiftLight3 {
        0%, 100% { fill: #7c3aed; }
        50% { fill: #a855f7; }
      }
      .shift-1 { animation: shiftLight1 3s infinite ease-in-out; }
      .shift-2 { animation: shiftLight2 4s infinite ease-in-out 1s; }
      .shift-3 { animation: shiftLight3 3.5s infinite ease-in-out 0.5s; }
      .scanner { animation: scanline 4s infinite linear; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="896" height="316" x="2" y="2" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Glowing Ambient Circles -->
  <circle cx="150" cy="80" r="90" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="750" cy="180" r="110" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>

  <!-- Calendar / Shift Graphic Icon -->
  <g transform="translate(60, 50)">
    <rect width="64" height="64" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Calendar Top Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 50 0 Q 64 0 64 14 L 64 20 L 0 20 Z" fill="#0284c7"/>
    <!-- Calendar Rings -->
    <rect x="14" y="-4" width="6" height="10" rx="3" fill="#e2e8f0"/>
    <rect x="44" y="-4" width="6" height="10" rx="3" fill="#e2e8f0"/>
    <!-- Shift Blocks -->
    <rect x="12" y="28" width="16" height="10" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="36" y="28" width="16" height="10" rx="3" fill="#818cf8" opacity="0.9"/>
    <rect x="12" y="44" width="26" height="10" rx="3" fill="#c084fc" opacity="0.9"/>
    <circle cx="48" cy="49" r="4" fill="#34d399"/>
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(145, 52)">
    <rect width="260" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED WORKFORCE PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="145" y="112" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Awesome Shift Scheduling</text>

  <!-- Subtitle -->
  <text x="145" y="140" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Enterprise SaaS Ecosystem • Open-Source Optimization Solvers • Roster Architectures
  </text>

  <!-- Interactive Shift Schedule Visualizer -->
  <g transform="translate(145, 170)">
    <!-- Schedule Container -->
    <rect width="610" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Days of the week header -->
    <text x="45" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">MON</text>
    <text x="130" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">TUE</text>
    <text x="215" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">WED</text>
    <text x="300" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">THU</text>
    <text x="385" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">FRI</text>
    <text x="470" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">SAT</text>
    <text x="555" y="20" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">SUN</text>

    <!-- Grid dividers -->
    <line x1="90" y1="8" x2="90" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="175" y1="8" x2="175" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="260" y1="8" x2="260" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="345" y1="8" x2="345" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="430" y1="8" x2="430" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="515" y1="8" x2="515" y2="80" stroke="#1e293b" stroke-width="1"/>

    <!-- Animated Shift Blocks -->
    <!-- Morning Shift -->
    <rect class="shift-1" x="15" y="30" width="65" height="18" rx="4"/>
    <text x="24" y="42" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Morning</text>

    <!-- Mid Shift -->
    <rect class="shift-2" x="100" y="30" width="65" height="18" rx="4"/>
    <text x="112" y="42" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Day 8h</text>

    <!-- Night Shift -->
    <rect class="shift-3" x="185" y="45" width="65" height="18" rx="4"/>
    <text x="195" y="57" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Night</text>

    <rect class="shift-1" x="270" y="30" width="65" height="18" rx="4"/>
    <text x="282" y="42" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Day 8h</text>

    <rect class="shift-2" x="355" y="45" width="65" height="18" rx="4"/>
    <text x="368" y="57" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Swing</text>

    <rect class="shift-3" x="440" y="30" width="65" height="18" rx="4"/>
    <text x="452" y="42" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Flex</text>

    <rect class="shift-1" x="525" y="45" width="65" height="18" rx="4"/>
    <text x="535" y="57" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Weekend</text>

    <!-- Secondary mini shift bars -->
    <rect x="15" y="54" width="40" height="14" rx="3" fill="#334155"/>
    <rect x="270" y="54" width="45" height="14" rx="3" fill="#334155"/>
    <rect x="355" y="26" width="50" height="14" rx="3" fill="#334155"/>

    <!-- Scanning Timeline Laser (Dynamic aspect) -->
    <line class="scanner" x1="10" y1="8" x2="10" y2="80" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(145, 275)">
    <g transform="translate(0, 0)">
      <rect width="95" height="22" rx="11" fill="#1e293b"/>
      <text x="12" y="15" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">⏱ 24/7 Rota</text>
    </g>
    <g transform="translate(105, 0)">
      <rect width="125" height="22" rx="11" fill="#1e293b"/>
      <text x="12" y="15" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="600">🧠 AI Optimization</text>
    </g>
    <g transform="translate(240, 0)">
      <rect width="135" height="22" rx="11" fill="#1e293b"/>
      <text x="12" y="15" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600">⚖️ Labor Compliance</text>
    </g>
    <g transform="translate(385, 0)">
      <rect width="115" height="22" rx="11" fill="#1e293b"/>
      <text x="12" y="15" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">📱 Mobile Clocks</text>
    </g>
    <g transform="translate(510, 0)">
      <rect width="100" height="22" rx="11" fill="#1e293b"/>
      <text x="12" y="15" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="600">⚡ Open Source</text>
    </g>
  </g>
</svg>